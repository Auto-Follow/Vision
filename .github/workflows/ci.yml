name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Raspberry Pi OS (Bookworm), 3.12 = Ubuntu 24.04 (laptop)
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bagimliliklar (sabit surumler)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/ci.txt
          pip install -e . --no-deps
      - name: Ruff (lint + bicim)
        run: |
          ruff check .
          ruff format --check .
      - name: Testler
        run: pytest -q
